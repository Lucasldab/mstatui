# mstatui config — copy to ~/.config/mstatui/config.toml
# Every field is optional. Defaults shown.

# Pulled from ~/.local/share/mpris-scrobbler/credentials [listenbrainz] if absent.
# username = "ISleeplessI"
# token    = "00000000-0000-0000-0000-000000000000"

# week | month | year | all
range = "week"

# Background refresh interval in seconds. 0 = manual refresh only (default).
refresh_interval = 0

[keys]
quit         = "q"
next_tab     = "l"
prev_tab     = "h"
down         = "j"
up           = "k"
top          = "g"
bottom       = "G"
refresh      = "r"
toggle_range = "t"

# Default palette mirrors the monochrome purple+pink-on-black theme used by my
# kitty/quickshell/fuzzel configs. Override any subset.
[colors]
accent      = "#9A6DD7"  # primary purple (titles, bars, now-playing)
accent_deep = "#5A2A82"  # deep purple (selection background)
muted       = "#6A6A6A"  # neutral gray (borders, secondary text)
positive    = "#9A6DD7"  # legacy slot — alias of accent
warning     = "#B83D8E"  # deep pink (transient states)
error       = "#FF6B6B"  # red
fg          = "#E5E5E5"
bg          = "#0D0D0D"
