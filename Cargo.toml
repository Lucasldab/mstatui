[package]
name = "mstatui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for ListenBrainz listen stats"
license = "MIT"
repository = "https://github.com/Lucasldab/mstatui"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "5"
anyhow = "1"
open = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
